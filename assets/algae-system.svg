  <rect y="180" width="900" height="340" fill="#dbece5"/>
  <rect y="180" width="900" height="70" fill="#88bfae"/>
  <g fill="#3f8d45" opacity="0.8">
    <circle cx="110" cy="210" r="16"/>
    <circle cx="158" cy="224" r="11"/>
    <circle cx="690" cy="212" r="15"/>
    <circle cx="748" cy="226" r="12"/>
    <circle cx="792" cy="204" r="10"/>
  </g>
  <rect x="390" y="92" width="120" height="70" rx="6" fill="#f0c65c" stroke="#202124" stroke-width="6"/>
  <line x1="450" y1="162" x2="450" y2="380" stroke="#202124" stroke-width="10"/>
  <path d="M450 380 C360 330 360 278 450 240 C540 278 540 330 450 380 Z" fill="#ffffff" stroke="#2f7d6d" stroke-width="8"/>
