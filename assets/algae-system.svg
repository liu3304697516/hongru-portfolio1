  <text x="450" y="60" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#202124">Hazardous Algae Removal</text>
  <text x="450" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5f6368">solar power, deep-water circulation, flow validation</text>
