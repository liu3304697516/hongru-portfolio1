<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Heat sink thermal design schematic</title>
  <desc id="desc">A simplified finned heat sink with airflow and temperature gradient indicators.</desc>
  <rect width="900" height="520" fill="#f7faf8"/>
  <rect x="210" y="330" width="480" height="56" rx="6" fill="#2f7d6d" stroke="#202124" stroke-width="7"/>
  <g fill="#dbece5" stroke="#202124" stroke-width="6">
    <rect x="245" y="160" width="38" height="170" rx="4"/>
    <rect x="320" y="130" width="38" height="200" rx="4"/>
    <rect x="395" y="104" width="38" height="226" rx="4"/>
    <rect x="470" y="104" width="38" height="226" rx="4"/>
    <rect x="545" y="130" width="38" height="200" rx="4"/>
    <rect x="620" y="160" width="38" height="170" rx="4"/>
  </g>
  <g stroke="#125c72" stroke-width="8" fill="none" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M104 210 H205"/>
    <path d="M104 270 H205"/>
    <path d="M695 210 H800"/>
    <path d="M695 270 H800"/>
  </g>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#125c72"/>
    </marker>
  </defs>
  <g fill="#f0c65c" stroke="#202124" stroke-width="5">
    <circle cx="450" cy="386" r="30"/>
    <path d="M450 410 C430 448 470 448 450 486 C500 452 514 424 486 392 Z"/>
  </g>
  <text x="450" y="66" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#202124">Heat Sink Design</text>
  <text x="450" y="472" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5f6368">conduction, convection, geometry iteration</text>
</svg>
