<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
  <title id="title">Flutter control simulation schematic</title>
  <desc id="desc">A simplified aircraft wing with vibration response curves and an active control loop.</desc>
  <rect width="900" height="520" fill="#f7faf8"/>
  <path d="M126 248 C300 168 560 146 780 196 C590 232 330 286 126 248 Z" fill="#dbece5" stroke="#202124" stroke-width="8"/>
  <path d="M180 252 C352 230 548 198 738 198" fill="none" stroke="#2f7d6d" stroke-width="7"/>
  <g fill="#f0c65c" stroke="#202124" stroke-width="5">
    <rect x="390" y="222" width="94" height="38" rx="6"/>
    <circle cx="292" cy="242" r="20"/>
  </g>
  <path d="M180 360 C220 310 270 410 315 360 C360 310 405 410 450 360 C495 310 540 410 585 360 C630 310 675 410 720 360" fill="none" stroke="#b74d4d" stroke-width="7"/>
  <path d="M180 420 C245 396 300 444 365 420 C430 396 485 444 550 420 C615 396 670 444 735 420" fill="none" stroke="#2f7d6d" stroke-width="7"/>
  <text x="452" y="76" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" fill="#202124">Active Flutter Control</text>
  <text x="452" y="116" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#5f6368">accelerometer feedback + piezoelectric actuation</text>
  <text x="742" y="364" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#b74d4d">uncontrolled</text>
  <text x="742" y="426" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#2f7d6d">controlled</text>
</svg>
